[project]
name = "python"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "jax>=0.8.0",
    "numpy",
]

[dependency-groups]
dev = [
    "mypy>=1.18.2",
]

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "jax.*",
    "jaxlib.*",
]
ignore_missing_imports = true
